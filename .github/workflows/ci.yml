name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Проверки качества ────────────────────────────────────────────────────
  checks:
    name: lint · typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck token scripts
        working-directory: token
        run: |
          npm ci
          npm run typecheck

  # ── Поиск секретов ───────────────────────────────────────────────────────
  # Отдельная работа, потому что её провал означает не «код плохой», а
  # «в репозиторий, возможно, уехал ключ» — это другой класс проблемы.
  #
  # Проект уже терял 1 000 000 DOFFA из-за плохой работы с ключами. Проверка
  # стоит секунды и ловит именно тот случай, когда кто-то в спешке коммитит
  # keypair.
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action запрашивает список коммитов PR. Без этого права
      # действие падает с 403 «Resource not accessible by integration».
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: ключ мог быть закоммичен и потом удалён — в рабочей
          # копии его уже нет, а в истории он остаётся навсегда.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ключи Solana в отслеживаемых файлах
        run: |
          # Точная проверка вместо грубого grep по «64 числа подряд».
          #
          # Грубый вариант давал ложное срабатывание на файлах покрытия тестов:
          # там тоже встречаются длинные числовые массивы. Признак настоящего
          # keypair другой — им является ВСЁ содержимое файла целиком:
          # массив ровно из 64 чисел 0..255 и ничего больше.
          #
          # Дополнительно ищем такие массивы, вшитые прямо в исходники, — там
          # длинных числовых литералов быть не должно вовсе.
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const files = execSync("git ls-files -z", { maxBuffer: 64e6 })
              .toString().split("\0").filter(Boolean)
              .filter((f) => !/package-lock\.json|^\.next\/|node_modules\//.test(f));

            const bad = [];
            const embedded = /\[\s*(?:\d{1,3}\s*,\s*){60,}\d{1,3}\s*\]/;

            for (const f of files) {
              let text;
              try { text = fs.readFileSync(f, "utf8"); } catch { continue; }

              if (f.endsWith(".json")) {
                try {
                  const j = JSON.parse(text);
                  const isKey = Array.isArray(j) && j.length === 64 &&
                    j.every((n) => Number.isInteger(n) && n >= 0 && n <= 255);
                  if (isKey) bad.push(f + "  (файл целиком — keypair Solana)");
                } catch { /* не JSON — не наш случай */ }
                continue;
              }

              if (/\.(ts|tsx|js|jsx|mjs|cjs)$/.test(f) && embedded.test(text)) {
                bad.push(f + "  (массив из 64+ чисел внутри исходника)");
              }
            }

            if (bad.length) {
              console.log("::error::Похоже на приватный ключ Solana:");
              bad.forEach((b) => console.log("  " + b));
              process.exit(1);
            }
            console.log("OK — ключей Solana не найдено (" + files.length + " файлов проверено).");
          '

      - name: Seed-фразы в отслеживаемых файлах
        run: |
          echo "Ищу строки из 12 или 24 слов подряд — так выглядит мнемоника BIP-39."
          FOUND=$(git ls-files -z \
            | grep -zvE '(package-lock\.json|\.next/|node_modules/)' \
            | xargs -0 grep -lEi '"([a-z]{3,8} ){11,23}[a-z]{3,8}"' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Похоже на seed-фразу в отслеживаемых файлах:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK — seed-фраз не найдено."

      - name: Файлы ключей не отслеживаются git
        run: |
          # Ключ мог быть добавлен до того, как появилась маска в .gitignore —
          # .gitignore не действует на уже отслеживаемые файлы.
          TRACKED=$(git ls-files \
            | grep -Ei '(^|/)(owner|wallet|keypair|credentials|id)[^/]*\.json$|\.(key|pem|secret)$' \
            | grep -v '\.env\.example' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Эти файлы похожи на секреты и ОТСЛЕЖИВАЮТСЯ git:"
            echo "$TRACKED"
            exit 1
          fi
          echo "OK — файлов-ключей под контролем версий нет."
